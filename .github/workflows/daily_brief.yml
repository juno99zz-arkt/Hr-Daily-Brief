name: HR Daily Brief

on:
  schedule:
    - cron: '30 20 * * 0-4'   # 1차 목표 05:30 KST = UTC 20:30 (기존보다 30분 앞당김)
    - cron: '0 22 * * 0-4'    # 2차(재촉) 07:00 KST = UTC 22:00 (기존보다 30분 앞당김). 1차가 아직이면 이때 대신 실행
  workflow_dispatch:
    inputs:
      force:
        description: '공휴일에도 강제 실행'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # gh-pages push에 필요

concurrency:
  group: daily-brief
  cancel-in-progress: false   # 1차·2차가 겹쳐 시작돼도 순서대로 실행 (동시 발송 방지)

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout gh-pages into public/
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public

      - name: 오늘 이미 발송됐는지 확인
        id: check
        run: |
          TODAY=$(TZ='Asia/Seoul' date '+%Y-%m-%d')
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "public/archive/$TODAY.html" ]; then
            echo "already_sent=true" >> "$GITHUB_OUTPUT"
            echo "오늘($TODAY) 브리핑이 이미 발송되었습니다. 재촉 실행을 건너뜁니다."
          else
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check.outputs.already_sent == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check.outputs.already_sent == 'false'
        run: pip install -r requirements.txt

      - name: Generate briefing
        if: steps.check.outputs.already_sent == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_SENDER:      ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT:   ${{ secrets.EMAIL_RECIPIENT }}
          GITHUB_ACTIONS:    "true"
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE="--force"
          fi
          python generate_brief.py --session morning $FORCE

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.already_sent == 'false'
        run: |
          cd public
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          # 날짜별 아카이브 저장
          DATED="archive/$(TZ='Asia/Seoul' date '+%Y-%m-%d').html"
          mkdir -p archive
          cp index.html "$DATED"

          # 중복 기사 차단용 제목 기록 (다음 실행에서 재사용)
          [ -f seen_titles.json ] && git add seen_titles.json

          git add index.html "$DATED"
          if git diff --cached --quiet; then
            echo "변경 없음, 배포 생략."
            exit 0
          fi

          git commit -m "브리핑 업데이트: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M') KST"
          git push origin gh-pages
          echo "배포 완료 → https://juno99zz-arkt.github.io/Hr-Daily-Brief/"
